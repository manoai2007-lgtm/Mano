name: quality

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy ruff types-flask bandit pip-audit
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy mano/ --strict
      - name: Security (bandit)
        run: bandit -r mano/
      - name: Dependencies (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Test
        run: pytest -q