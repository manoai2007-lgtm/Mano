[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mano"
version = "0.1.0"
description = "A small user-management API in Flask."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.6", "types-flask", "bandit>=1.7", "pip-audit"]

[tool.setuptools]
packages = ["mano"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true